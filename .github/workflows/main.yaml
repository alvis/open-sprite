name: main

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test related changes
        run: |
          if ! git diff --quiet "$BASE_SHA" -- package.json pnpm-lock.yaml pnpm-workspace.yaml \
            'presetter.config.*' 'vitest.config.*' 'vite.config.*'; then
            pnpm run test
          elif ! git diff --quiet "$BASE_SHA" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs'; then
            pnpm run test -- --project='*:UNIT' --changed="$BASE_SHA"
          fi

      - name: Lint changed files
        run: |
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" -- \
            '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.json' '*.yaml' '*.yml' '*.md' \
            ':(exclude)pnpm-lock.yaml' |
            xargs -0 -r pnpm run lint --
          git diff --exit-code
